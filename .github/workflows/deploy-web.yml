name: Deploy Web

# Manual only: trigger from GitHub -> Actions -> Deploy Web -> Run workflow.
# No automatic deploy on push, and Vercel's own git-triggered deploys are
# disabled via its "Ignored Build Step" setting — this workflow is the only
# thing that deploys to production.
on:
  workflow_dispatch:

jobs:
  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy to Vercel
        # `secrets` isn't a valid context inside a step `if:` — pull it into
        # `env` first (this is why this workflow never ran, since the very
        # first commit: "Unrecognized named-value: 'secrets'").
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # npx --yes skips npx's install prompt / silent fetch (2026-09-03 hang).
        # vercel --yes is the CLI. --prebuilt is a follow-up.
        run: npx --yes vercel@59.11.2 deploy --prod --yes --token "$VERCEL_TOKEN"
